# .github/workflows/snake.yml
name: Generate Contribution Snake

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - '.github/workflows/snake.yml'
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk@v1
        with:
          github_user_name: ${{ github.repository_owner }}   # your GitHub username
          svg_out_path: github-contribution-grid-snake.svg   # where to write the SVG
          args: --color 'rgba(66,153,225,0.8)'              # optional color arg

      - name: Commit & Push snake
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg
          git commit -m "chore: update contribution snake" || echo "No changes to commit"
          git push
