name: Generate Contribution Snake

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - '.github/workflows/snake.yml'
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0               # ← fetch entire commit history
          persist-credentials: true    # ← so we can push the SVG back

      - name: Generate snake SVG
        uses: Platane/snk@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          svg_out_path: github-contribution-grid-snake.svg
          # (no args, use default snake color)

      - name: Commit & Push snake
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg
          git commit -m "chore: update contribution snake" || echo "No changes to commit"
          git push
